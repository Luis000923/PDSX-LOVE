ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    # Página pública de pareja: /c/abc12345  (a nivel de vhost, no requiere FollowSymLinks)
    RewriteEngine On
    RewriteRule ^/c/([a-z0-9]{6,12})/?$ /view.php?u=$1 [L,QSA]

    <Directory /var/www/app/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Las subidas (miniaturas) nunca deben ejecutarse como código.
    <Directory /var/www/app/public/assets>
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
