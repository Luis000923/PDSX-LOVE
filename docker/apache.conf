ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    # Página pública de pareja: /c/abc12345  (a nivel de vhost, no requiere FollowSymLinks)
    RewriteEngine On
    RewriteRule ^/c/([a-z0-9]{6,12})/?$ /view.php?u=$1 [L,QSA]
    # Documento aislado (HTML propio del usuario): frame.php lo sirve con CSP `sandbox` y solo dentro de nuestro iframe.
    RewriteRule ^/c/([a-z0-9]{6,12})/f$ /frame.php?u=$1 [L,QSA]

    # Errores con la marca de la app (AllowOverride es None: no se leen los .htaccess).
    ErrorDocument 403 /error.php
    ErrorDocument 404 /error.php
    ErrorDocument 410 /error.php
    ErrorDocument 500 /error.php

    <Directory /var/www/app/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Las subidas (miniaturas) nunca deben ejecutarse como código.
    <Directory /var/www/app/public/assets>
        php_admin_flag engine off
        Options -ExecCGI
        <FilesMatch "(?i)\.(php\d?|phtml|phar|pl|py|cgi|sh)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
        </IfModule>
    </Directory>

    # Fotos y recursos que suben los usuarios: nunca se ejecutan como código y, si alguien abre un
    # archivo directamente (p. ej. un .svg), el navegador lo trata como documento aislado y sin scripts.
    <Directory /var/www/app/public/uploads>
        php_admin_flag engine off
        Options -ExecCGI -Indexes
        <FilesMatch "(?i)\.(php\d?|phtml|phar|pl|py|cgi|sh|html?|xhtml|shtml)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
            # Los documentos de HTML propio están en un sandbox (origen opaco): sus fuentes web exigen CORS.
            Header set Access-Control-Allow-Origin "*"
        </IfModule>
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
