expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
session.cookie_httponly = 1
session.use_strict_mode = 1
; Fotos de plantillas: hasta 12 x 5 MB por página, pero sin permitir peticiones descomunales.
file_uploads = On
upload_max_filesize = 6M
post_max_size = 40M
max_file_uploads = 24
opcache.enable = 1
opcache.validate_timestamps = 0
