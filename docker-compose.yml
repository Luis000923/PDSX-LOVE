services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: lovepages
      MYSQL_USER: lovepages
      MYSQL_PASSWORD: lovepages_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_dev_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_storage:
  app_uploads: