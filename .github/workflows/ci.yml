name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Lint, análisis estático y tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist
      - name: Lint (php -l)
        run: find src config public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPStan
        run: composer stan
      - name: PHPUnit
        run: composer test

  security:
    name: Seguridad (secretos, dependencias, IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secretos en el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - name: Composer audit
        run: composer audit --no-interaction
      - name: Trivy (vulnerabilidades, secretos y misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Imagen Docker (lint, build, humo, escaneo)
    runs-on: ubuntu-latest
    needs: php
    env:
      EVENTS_SECRET: evt_ci
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: love:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Arrancar contenedor (igual que producción, read-only)"
        run: |
          docker run -d --name love -p 8080:80 --read-only \
            --tmpfs /tmp --tmpfs /var/run/apache2 --tmpfs /var/lock/apache2 --tmpfs /var/log/apache2 \
            -v love-data:/var/www/data -v love-tpl:/var/www/app/templates -v love-thumbs:/var/www/app/public/assets/thumbs \
            -e APP_URL=http://127.0.0.1:8080 \
            -e WOMPI_PUBLIC_KEY=pub_ci -e WOMPI_INTEGRITY_SECRET=int_ci -e WOMPI_EVENTS_SECRET=$EVENTS_SECRET \
            love:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' love)" = healthy ] && exit 0
            sleep 2
          done
          docker logs love; exit 1
      - name: Prueba de humo E2E
        run: tests/smoke.sh http://127.0.0.1:8080 "$EVENTS_SECRET"
      - name: "Prueba de humo del panel admin (instancia limpia: el 1.er registro es el admin)"
        run: |
          docker run -d --name love-admin -p 8081:80 --read-only \
            --tmpfs /tmp --tmpfs /var/run/apache2 --tmpfs /var/lock/apache2 --tmpfs /var/log/apache2 \
            -v love-admin-data:/var/www/data -v love-admin-tpl:/var/www/app/templates \
            -v love-admin-thumbs:/var/www/app/public/assets/thumbs \
            -e APP_URL=http://127.0.0.1:8081 \
            -e WOMPI_PUBLIC_KEY=pub_ci -e WOMPI_INTEGRITY_SECRET=int_ci -e WOMPI_EVENTS_SECRET=$EVENTS_SECRET \
            love:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' love-admin)" = healthy ] && break
            sleep 2
          done
          tests/smoke_admin.sh http://127.0.0.1:8081
      - name: Logs si falla
        if: failure()
        run: docker logs love; docker logs love-admin || true
      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: love:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
