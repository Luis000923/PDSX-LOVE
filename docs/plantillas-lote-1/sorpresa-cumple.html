<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>Sorpresa para {{partner_name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{overflow-x:hidden}
  body{font-family:'Poppins',system-ui,sans-serif}
  #confetti-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:40}
  .confetti{position:absolute;top:-10px;will-change:transform,opacity;animation:fall linear forwards}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(110vh) rotate(540deg);opacity:.9}
  }
  .gift{transition:transform .25s ease}
  .gift:active{transform:scale(.97)}
  .lid{transform-origin:50% 100%;transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s ease}
  .box-wrap.is-open .lid{transform:translateY(-70%) rotate(-18deg);opacity:0}
  .box-wrap.is-open .box-body{animation:wiggle .5s ease}
  @keyframes wiggle{0%{transform:rotate(0)}25%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
  .intro-panel{transition:opacity .4s ease, transform .4s ease}
  .box-wrap.is-open .intro-panel{opacity:0;transform:translateY(-8px);pointer-events:none}
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease .15s, transform .6s ease .15s}
  .reveal.show{opacity:1;transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){
    .confetti{display:none}
    .lid{transition:none}
    .box-wrap.is-open .box-body{animation:none}
    .reveal{transition:opacity .15s ease}
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-400 via-fuchsia-500 to-amber-400 text-white flex flex-col items-center px-4 sm:px-6 py-10 overflow-x-hidden">
  <div id="confetti-layer" aria-hidden="true"></div>

  <main class="w-full max-w-md text-center relative z-10">
    <div id="box-wrap" class="box-wrap">
      <div class="intro-panel">
        <p class="text-white/90 text-sm font-semibold tracking-wide uppercase">Feliz cumpleaños</p>
        <h1 class="text-[clamp(1.5rem,7vw,2.5rem)] font-extrabold leading-tight break-words mt-1">{{partner_name}}</h1>
        <p class="mt-2 text-white/90">Toca la caja para abrir tu sorpresa</p>
      </div>

      <button type="button" id="gift-btn" aria-label="Toca para abrir tu sorpresa de cumpleaños" class="gift box-body mt-6 mx-auto block w-full max-w-[280px] min-h-[220px] cursor-pointer focus:outline-none focus-visible:ring-4 focus-visible:ring-white/70 rounded-3xl">
        <svg viewBox="0 0 240 220" width="100%" height="100%" role="img" aria-hidden="true" class="drop-shadow-xl">
          <rect x="30" y="90" width="180" height="110" rx="14" fill="#f43f5e"></rect>
          <rect x="30" y="90" width="180" height="110" rx="14" fill="url(#gradBody)" opacity="0.35"></rect>
          <rect x="102" y="90" width="36" height="110" fill="#fbbf24"></rect>
          <g class="lid">
            <rect x="18" y="60" width="204" height="40" rx="10" fill="#fb7185"></rect>
            <rect x="98" y="60" width="44" height="40" fill="#fbbf24"></rect>
            <path d="M120 60 C 80 10, 40 20, 55 50 C 70 68, 105 62, 120 60 Z" fill="#fbbf24"></path>
            <path d="M120 60 C 160 10, 200 20, 185 50 C 170 68, 135 62, 120 60 Z" fill="#fbbf24"></path>
            <circle cx="120" cy="58" r="10" fill="#f59e0b"></circle>
          </g>
          <defs>
            <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0.6"></stop>
              <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
        </svg>
      </button>
    </div>

    <section id="reveal-panel" class="reveal mt-8 rounded-3xl bg-white/15 backdrop-blur p-6 border border-white/20 text-left" aria-live="polite">
      <p class="text-center text-[clamp(1.25rem,6vw,1.75rem)] font-bold break-words">{{your_name}} ♥ {{partner_name}}</p>

      <p class="text-center text-sm text-white/80 mt-3">Llevamos celebrando juntos</p>
      <p class="text-center text-[clamp(2rem,10vw,3rem)] font-extrabold my-1 break-words"><span id="days" data-start="{{start_date}}">{{days_together}}</span></p>
      <p class="text-center text-white/80">días desde que empezó todo</p>

      <p class="text-center text-xs text-white/70 mt-4" id="open-timer">Llevas <span id="open-seconds">0</span> segundos sonriendo</p>

      <div class="mt-5 rounded-2xl bg-white/10 p-4 leading-relaxed break-words [overflow-wrap:anywhere] whitespace-pre-line">{{message}}</div>

      <p class="mt-4 text-right font-semibold break-words">— {{your_name}}</p>
    </section>

    {{{ad_slot}}}
  </main>

  <script nonce="{{{nonce}}}">
    (function () {
      var daysEl = document.getElementById('days');
      var p = (daysEl.dataset.start || '').split('-').map(Number);
      if (p.length === 3 && !isNaN(p[0])) {
        var now = new Date();
        var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        var start = Date.UTC(p[0], p[1] - 1, p[2]);
        daysEl.textContent = Math.max(0, Math.floor((today - start) / 86400000)).toLocaleString('es');
      }

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var boxWrap = document.getElementById('box-wrap');
      var giftBtn = document.getElementById('gift-btn');
      var revealPanel = document.getElementById('reveal-panel');
      var confettiLayer = document.getElementById('confetti-layer');
      var openedAt = null;
      var secondsEl = document.getElementById('open-seconds');
      var opened = false;

      var colors = ['#fb7185', '#fbbf24', '#38bdf8', '#e879f9', '#a3e635'];
      var shapes = ['50%', '2px', '50% 0 50% 0'];

      function spawnConfettiBurst() {
        var count = 45;
        for (var i = 0; i < count; i++) {
          (function () {
            var s = document.createElement('span');
            s.className = 'confetti';
            var size = 6 + Math.random() * 8;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.background = colors[Math.floor(Math.random() * colors.length)];
            s.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
            var duration = 2.2 + Math.random() * 1.8;
            s.style.animationDuration = duration + 's';
            s.style.animationDelay = (Math.random() * 0.6) + 's';
            confettiLayer.appendChild(s);
            setTimeout(function () { s.remove(); }, (duration + 1) * 1000);
          })();
        }
      }

      function openGift() {
        if (opened) return;
        opened = true;
        boxWrap.classList.add('is-open');
        revealPanel.classList.add('show');
        openedAt = Date.now();

        if (!reduceMotion) {
          spawnConfettiBurst();
          setTimeout(spawnConfettiBurst, 350);
          setInterval(function () {
            if (Date.now() - openedAt < 6000) spawnConfettiBurst();
          }, 900);
        }

        var timer = setInterval(function () {
          if (!openedAt) return;
          secondsEl.textContent = Math.floor((Date.now() - openedAt) / 1000).toLocaleString('es');
        }, 1000);
        window.__lpTimer = timer;
      }

      giftBtn.addEventListener('click', openGift);
      giftBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); }
      });
    })();
  </script>
</body>
</html>
