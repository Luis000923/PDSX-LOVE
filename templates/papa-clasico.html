<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Para pap&aacute;, {{partner_name}}</title><link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:'Source Sans 3',sans-serif;background:#f5f5f4}.slab{font-family:'Roboto Slab',serif}.bar{height:10px;background:#334155}</style></head><body class="min-h-screen px-5 py-12 text-slate-900"><main class="mx-auto max-w-md"><div class="bar"></div><p class="mt-10 text-xs font-bold uppercase tracking-[.3em] text-slate-500">Un mensaje para pap&aacute;</p><h1 class="slab mt-4 text-[clamp(2.5rem,11vw,4rem)] leading-tight break-words">Gracias por ser mi gu&iacute;a</h1><p class="mt-6 text-lg break-words">{{partner_name}}</p><section class="mt-9 border-l-4 border-slate-700 bg-white p-7 text-left shadow-sm break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-8">{{message}}</p><p class="mt-7 text-right font-bold text-slate-700">De {{your_name}}</p></section>{{{ad_slot}}}</main></body></html>
