<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Felicidades, {{partner_name}}</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:'Plus Jakarta Sans',sans-serif;background:#ecfdf5}.mono{font-family:'Space Mono',monospace}.check{height:76px;width:76px;border-radius:50%;background:#10b981;color:white;display:grid;place-items:center;font-size:2.5rem}</style></head><body class="min-h-screen px-5 py-12 text-emerald-950"><main class="mx-auto max-w-md"><div class="check">&#10003;</div><p class="mono mt-10 text-xs font-bold uppercase tracking-[.2em] text-emerald-700">Meta alcanzada</p><h1 class="mt-4 text-[clamp(2.5rem,11vw,4rem)] font-extrabold leading-tight break-words">Felicidades,<br>{{partner_name}}</h1><p class="mt-5 text-emerald-800/70">Todo tu esfuerzo vali&oacute; la pena.</p><section class="mt-9 rounded-3xl bg-white p-7 text-left shadow-xl break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-8">{{message}}</p><p class="mt-7 text-right font-bold text-emerald-700">Te admira, {{your_name}}</p></section>{{{ad_slot}}}</main></body></html>
