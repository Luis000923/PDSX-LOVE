<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>{{your_name}} para {{partner_name}}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>html,body{overflow-x:hidden}body{font-family:Manrope,sans-serif;background:#f7f4ef}.serif{font-family:'DM Serif Display',serif}.line{width:1px;background:#b45309}</style>
</head>
<body class="min-h-screen px-5 py-12 text-stone-800"><main class="mx-auto max-w-md"><div class="flex items-center gap-4 text-xs uppercase tracking-[.3em] text-amber-800"><span>01</span><span class="h-px flex-1 bg-amber-800/30"></span><span>Para ti</span></div><h1 class="serif mt-12 text-[clamp(3rem,14vw,5rem)] leading-[.9] break-words">Todo lo bonito<br>me lleva a ti.</h1><p class="mt-7 max-w-xs text-sm leading-7 text-stone-500">Una nota de {{your_name}} para {{partner_name}}.</p><section class="mt-12 border-y border-stone-300 py-7 text-lg leading-8 break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line">{{message}}</p></section><p class="mt-6 text-right text-sm font-semibold text-amber-800">Con amor, {{your_name}}</p>{{{ad_slot}}}</main></body>
</html>
