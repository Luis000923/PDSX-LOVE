<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Una vida juntos</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:Montserrat,sans-serif;background:#fffbeb}.serif{font-family:'Cormorant Garamond',serif}.ring{height:74px;width:74px;border:2px solid #a16207;border-radius:50%;box-shadow:inset 0 0 0 5px #fffbeb,inset 0 0 0 7px #a16207;transform:rotate(45deg)}</style></head><body class="min-h-screen px-5 py-12 text-stone-800"><main class="mx-auto max-w-md text-center"><div class="ring mx-auto"></div><p class="mt-10 text-xs font-bold uppercase tracking-[.3em] text-amber-700">Una vida por comenzar</p><h1 class="serif mt-4 text-[clamp(3rem,13vw,5rem)] leading-none break-words">S&iacute;, acepto</h1><p class="mt-5 text-lg break-words">{{your_name}} &amp; {{partner_name}}</p><section class="mt-9 rounded-sm border border-amber-200 bg-white p-7 text-left shadow-lg break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-8">{{message}}</p><p class="mt-7 text-right font-semibold text-amber-700">Con amor, siempre.</p></section>{{{ad_slot}}}</main></body></html>
