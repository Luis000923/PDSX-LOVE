<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Una carta para {{partner_name}}</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:'Nunito Sans',sans-serif;background:linear-gradient(145deg,#fff7ed,#fce7f3)}.serif{font-family:'Playfair Display',serif}.sun{height:100px;width:100px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 16px #fde68a55,0 0 0 32px #fef3c755}</style></head><body class="min-h-screen px-5 py-12 text-rose-950"><main class="mx-auto max-w-md text-center"><div class="sun mx-auto"></div><p class="mt-12 text-xs font-bold uppercase tracking-[.3em] text-rose-600">Buenos d&iacute;as, mi amor</p><h1 class="serif mt-4 text-[clamp(2.5rem,11vw,4rem)] leading-tight break-words">{{partner_name}}</h1><p class="mt-4 text-rose-800/70">Que hoy encuentres motivos para sonre&iacute;r.</p><section class="mt-9 rounded-[2rem] bg-white/80 p-7 text-left shadow-xl shadow-rose-900/5 break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-8">{{message}}</p><p class="mt-6 text-right font-semibold text-rose-600">{{your_name}}</p></section>{{{ad_slot}}}</main></body></html>
