<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Felicidades siempre</title><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"><style>html,body{overflow-x:hidden}body{margin:0;background:#f0fdf4;color:#14532d;font-family:Manrope,sans-serif}.wrap{max-width:440px;margin:auto;padding:58px 24px}.serif{font-family:'Libre Baskerville',serif}.star{font-size:5rem;color:#16a34a}.card{margin-top:36px;border:1px solid #86efac;padding:30px;line-height:1.9;overflow-wrap:anywhere}</style></head><body><main class="wrap"><div class="star">&#10022;</div><p style="font-size:.7rem;text-transform:uppercase;letter-spacing:.3em;color:#15803d">Siempre hay algo que celebrar</p><h1 class="serif" style="font-size:clamp(2.7rem,11vw,4.5rem);line-height:1">Felicidades<br>{{partner_name}}</h1><section class="card"><p>{{message}}</p><p style="text-align:right;color:#15803d;font-weight:700">Con cari&ntilde;o, {{your_name}}</p></section>{{{ad_slot}}}</main></body></html>
