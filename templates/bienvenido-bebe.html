<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>Bienvenido, {{partner_name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>html,body{overflow-x:hidden}body{font-family:'Quicksand',sans-serif;background:#eaf7f7}.serif{font-family:'Playfair Display',serif}.cloud{animation:float 5s ease-in-out infinite}.cloud:nth-child(2){animation-delay:-2s}@keyframes float{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.cloud{animation:none}}</style>
</head>
<body class="min-h-screen px-4 py-12 text-slate-700">
<main class="mx-auto w-full max-w-md text-center">
  <div class="flex justify-center gap-10 text-5xl text-white" aria-hidden="true"><span class="cloud">&#9729;</span><span class="cloud text-pink-300">&#9733;</span><span class="cloud">&#9729;</span></div>
  <p class="mt-6 text-sm font-bold uppercase tracking-[.25em] text-teal-700">Una nueva historia comienza</p>
  <h1 class="serif mt-3 text-[clamp(2.3rem,10vw,3.6rem)] leading-tight break-words">Bienvenido/a, {{partner_name}}</h1>
  <p class="mt-4">Con mucha ternura, de parte de {{your_name}}</p>
  <section class="mt-8 rounded-[2rem] border border-teal-100 bg-white p-7 text-left shadow-xl break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-relaxed">{{message}}</p><p class="mt-6 text-right font-bold text-teal-700">Con amor, {{your_name}}</p></section>
  {{{ad_slot}}}
</main>
</body>
</html>
