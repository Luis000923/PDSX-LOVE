<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>Navidad para {{partner_name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>html,body{overflow-x:hidden}body{font-family:'Nunito Sans',sans-serif;background:#063b35;background-image:radial-gradient(#fef3c7 1px,transparent 1px);background-size:38px 38px}.christmas{font-family:'Mountains of Christmas',cursive}.snow{animation:drift 5s ease-in-out infinite}.snow:nth-child(2){animation-delay:-2s}@keyframes drift{50%{transform:translateY(8px)}}@media(prefers-reduced-motion:reduce){.snow{animation:none}}</style>
</head>
<body class="min-h-screen px-4 py-12 text-amber-50">
<main class="mx-auto w-full max-w-md text-center">
  <div class="text-5xl" aria-hidden="true"><span class="snow inline-block">❄</span> <span class="text-red-300">★</span> <span class="snow inline-block">❄</span></div>
  <p class="mt-5 text-sm font-bold uppercase tracking-[.28em] text-amber-200">Una Navidad más</p>
  <h1 class="christmas mt-2 text-[clamp(3rem,14vw,5rem)] leading-none break-words">Juntos</h1>
  <p class="mt-3 text-lg break-words">Para {{partner_name}}, con cariño de {{your_name}}</p>
  <section class="mt-8 rounded-3xl border border-amber-200/30 bg-white/10 p-6 text-left backdrop-blur break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-relaxed">{{message}}</p><p class="mt-5 text-right font-bold text-red-300">Feliz Navidad ♥</p></section>
  {{{ad_slot}}}
</main>
</body>
</html>
