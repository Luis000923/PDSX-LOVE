<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Lo lograste, {{partner_name}}</title><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:Outfit,sans-serif;background:#f8fafc}.serif{font-family:'Libre Baskerville',serif}.rule{height:5px;background:linear-gradient(90deg,#1e3a8a,#60a5fa,#fbbf24)}</style></head><body class="min-h-screen px-5 py-12 text-slate-900"><main class="mx-auto max-w-md"><div class="rule"></div><p class="mt-10 text-xs font-bold uppercase tracking-[.3em] text-blue-700">Un cap&iacute;tulo termina</p><h1 class="serif mt-5 text-[clamp(2.2rem,10vw,3.5rem)] leading-tight break-words">Y otro comienza,<br>{{partner_name}}</h1><p class="mt-6 text-slate-600">Hoy celebramos todo lo que construiste.</p><section class="mt-10 rounded-2xl border border-slate-200 bg-white p-7 text-left shadow-lg break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-8">{{message}}</p><p class="mt-7 text-right font-bold text-blue-700">Con orgullo, {{your_name}}</p></section>{{{ad_slot}}}</main></body></html>
