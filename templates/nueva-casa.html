<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Nuevo hogar, {{partner_name}}</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Yeseva+One&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:Montserrat,sans-serif;background:#fffbeb}.display{font-family:'Yeseva One',serif}.window{border:8px solid #92400e;box-shadow:inset 0 0 0 6px #fef3c7}</style></head><body class="min-h-screen px-5 py-12 text-amber-950"><main class="mx-auto max-w-md"><div class="window mx-auto grid h-24 w-24 grid-cols-2 grid-rows-2 bg-amber-100"><span class="border border-amber-700/30"></span><span class="border border-amber-700/30"></span><span class="border border-amber-700/30"></span><span class="border border-amber-700/30"></span></div><p class="mt-10 text-center text-xs font-bold uppercase tracking-[.3em] text-amber-700">Nueva casa, nuevos recuerdos</p><h1 class="display mt-4 text-center text-[clamp(2.3rem,10vw,3.5rem)] leading-tight break-words">Bienvenido a tu nuevo hogar</h1><p class="mt-5 text-center text-amber-800/70">Para {{partner_name}}, de {{your_name}}.</p><section class="mt-9 rounded-3xl bg-white p-7 text-left shadow-lg break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-8">{{message}}</p><p class="mt-7 text-right font-semibold text-amber-700">Que aqu&iacute; seas muy feliz.</p></section>{{{ad_slot}}}</main></body></html>
