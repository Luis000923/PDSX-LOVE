<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com"><title>Nuestro aniversario</title><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script><style>html,body{overflow-x:hidden}body{font-family:Inter,sans-serif;background:#f5f5f4}.serif{font-family:'Libre Baskerville',serif}.dot{height:7px;width:7px;border-radius:50%;background:#be123c}</style></head><body class="min-h-screen px-5 py-12 text-stone-800"><main class="mx-auto max-w-md"><div class="flex items-center gap-2 text-rose-700"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p class="mt-8 text-xs font-bold uppercase tracking-[.3em] text-stone-500">Nuestra fecha favorita</p><h1 class="serif mt-4 text-[clamp(2rem,9vw,3.2rem)] leading-tight break-words">{{your_name}}<br><span class="text-rose-700">y</span> {{partner_name}}</h1><div class="mt-9 border-l-2 border-rose-700 pl-5"><p class="text-sm leading-7 text-stone-600">Cada d&iacute;a contigo es una peque&ntilde;a celebraci&oacute;n.</p><p class="mt-2 text-sm font-semibold text-rose-700">Juntos desde {{start_date}}</p></div><section class="mt-10 rounded-2xl border border-stone-200 bg-white p-6 leading-8 break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line">{{message}}</p><p class="mt-5 text-right text-sm font-bold text-rose-700">Siempre, {{your_name}}</p></section>{{{ad_slot}}}</main></body></html>
