<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Nuestro futuro</title><link href="https://fonts.googleapis.com/css2?family=Gloock&family=Outfit:wght@400;600&display=swap" rel="stylesheet"><style>html,body{overflow-x:hidden}body{margin:0;background:#eef2ff;color:#1e1b4b;font-family:Outfit,sans-serif}.wrap{max-width:440px;margin:auto;padding:56px 24px}.display{font-family:Gloock,serif}.arrow{font-size:5rem;color:#6366f1}.card{margin-top:36px;background:#e0e7ff;padding:30px;border-radius:22px;line-height:1.9;overflow-wrap:anywhere}</style></head><body><main class="wrap"><div class="arrow">&rarr;</div><p style="font-size:.7rem;text-transform:uppercase;letter-spacing:.3em;color:#4338ca">Lo que viene</p><h1 class="display" style="font-size:clamp(2.7rem,11vw,4.5rem);line-height:1">Nuestro<br>futuro</h1><p>{{your_name}} &amp; {{partner_name}}</p><section class="card"><p>{{message}}</p><p style="text-align:right;color:#4338ca;font-weight:700">Juntos, adelante</p></section>{{{ad_slot}}}</main></body></html>
