<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>Para siempre | {{your_name}} y {{partner_name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>html,body{overflow-x:hidden}body{font-family:'Montserrat',sans-serif;background:#faf8f2}.serif{font-family:'Cormorant Garamond',serif}.ring{border-radius:50%;border:5px solid #c59d5f;box-shadow:inset 0 0 0 4px #faf8f2,inset 0 0 0 7px #c59d5f;transform:rotate(45deg);animation:turn 8s linear infinite}@keyframes turn{to{transform:rotate(405deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}</style>
</head>
<body class="min-h-screen px-4 py-12 text-stone-800">
<main class="mx-auto w-full max-w-md text-center">
  <div class="ring mx-auto flex h-20 w-20 items-center justify-center"><span class="-rotate-45 text-2xl text-amber-700">&#9829;</span></div>
  <p class="mt-8 text-xs font-bold uppercase tracking-[.3em] text-amber-700">Una promesa para recordar</p>
  <h1 class="serif mt-3 text-[clamp(2.8rem,12vw,4.5rem)] leading-none break-words">Para siempre</h1>
  <p class="mt-5 text-lg break-words">{{your_name}} &amp; {{partner_name}}</p>
  <section class="mt-8 rounded-sm border border-amber-200 bg-white p-7 text-left shadow-lg break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-relaxed">{{message}}</p><p class="mt-6 text-right font-semibold text-amber-700">Con amor, hoy y siempre.</p></section>
  {{{ad_slot}}}
</main>
</body>
</html>
