<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>Para {{partner_name}}, con amor</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>html,body{overflow-x:hidden}body{font-family:'Work Sans',sans-serif;background:#fff1f2}.serif{font-family:'Fraunces',serif}.flower{animation:sway 3s ease-in-out infinite}.flower:nth-child(2){animation-delay:-1s}@keyframes sway{50%{transform:rotate(8deg) translateY(-4px)}}@media(prefers-reduced-motion:reduce){.flower{animation:none}}</style>
</head>
<body class="min-h-screen px-4 py-12 text-rose-950">
<main class="mx-auto w-full max-w-md text-center">
  <div class="flex justify-center gap-5 text-5xl" aria-hidden="true"><span class="flower">&#10047;</span><span class="flower text-pink-500">&#10047;</span><span class="flower">&#10047;</span></div>
  <p class="mt-6 text-sm font-bold uppercase tracking-[.24em] text-rose-600">Para una mujer extraordinaria</p>
  <h1 class="serif mt-3 text-[clamp(2.5rem,11vw,4rem)] leading-tight break-words">{{partner_name}}</h1>
  <p class="mt-3 text-lg">Mi hero&iacute;na, mi hogar, mi ejemplo.</p>
  <section class="mt-8 rounded-3xl border border-rose-200 bg-white p-7 text-left shadow-xl break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line leading-relaxed">{{message}}</p><p class="mt-6 text-right font-bold text-rose-600">Con todo mi amor, {{your_name}}</p></section>
  {{{ad_slot}}}
</main>
</body>
</html>
