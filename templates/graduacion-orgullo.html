<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-{{{nonce}}}' https://cdn.tailwindcss.com">
<title>¡Lo lograste, {{partner_name}}!</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script nonce="{{{nonce}}}" src="https://cdn.tailwindcss.com"></script>
<style>html,body{overflow-x:hidden}body{font-family:'DM Sans',sans-serif;background:#f7f4ef}.headline{font-family:'Archivo Black',sans-serif}.stripe{background:repeating-linear-gradient(135deg,#172554 0 12px,#2563eb 12px 24px,#fbbf24 24px 36px)}.cap{animation:cap 3s ease-in-out infinite}@keyframes cap{50%{transform:translateY(-8px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.cap{animation:none}}</style>
</head>
<body class="min-h-screen px-4 py-10 text-slate-900">
<main class="mx-auto w-full max-w-md overflow-hidden rounded-[2rem] bg-white shadow-xl">
  <div class="stripe h-5"></div>
  <div class="p-7 sm:p-9">
    <div class="flex items-start justify-between gap-4"><div><p class="text-sm font-bold uppercase tracking-[.22em] text-blue-700">Misión cumplida</p><h1 class="headline mt-3 text-[clamp(2rem,10vw,3.4rem)] leading-none break-words">¡LO<br>LOGRASTE!</h1></div><span class="cap text-5xl" aria-hidden="true">🎓</span></div>
    <p class="mt-7 text-xl font-bold break-words">{{partner_name}}</p>
    <section class="mt-5 rounded-2xl bg-blue-50 p-5 leading-relaxed break-words [overflow-wrap:anywhere]"><p class="whitespace-pre-line">{{message}}</p><p class="mt-5 text-right font-bold text-blue-700">Con orgullo, {{your_name}}</p></section>
    <div class="mt-7 border-t-2 border-dashed border-slate-200 pt-5 text-sm text-slate-500">El próximo capítulo apenas comienza.</div>
  </div>
  {{{ad_slot}}}
</main>
</body>
</html>
