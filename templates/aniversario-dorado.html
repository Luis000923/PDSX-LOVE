<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Aniversario dorado</title><link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"><style>html,body{overflow-x:hidden}body{margin:0;background:#fffbeb;color:#451a03;font-family:Manrope,sans-serif}.wrap{max-width:440px;margin:auto;padding:58px 24px}.serif{font-family:'Libre Bodoni',serif}.ring{height:100px;width:100px;border-radius:50%;border:3px solid #ca8a04;margin:auto;box-shadow:inset 0 0 0 6px #fffbeb,inset 0 0 0 9px #eab308}.card{margin-top:40px;background:#fef3c7;padding:30px;line-height:1.9;overflow-wrap:anywhere}</style></head><body><main class="wrap"><div class="ring"></div><p style="margin-top:40px;font-size:.7rem;text-transform:uppercase;letter-spacing:.3em;color:#a16207">Un amor que permanece</p><h1 class="serif" style="font-size:clamp(2.7rem,11vw,4.4rem);line-height:1">Feliz aniversario,<br>{{partner_name}}</h1><p>{{your_name}} celebra contigo.</p><section class="card"><p>{{message}}</p></section>{{{ad_slot}}}</main></body></html>
